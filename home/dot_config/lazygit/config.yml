gui:
  sidePanelWidth: 0.2 # narrow left panel so diffs get more horizontal room
  # Kanagawa Dragon — https://github.com/rebelot/kanagawa.nvim
  theme:
    activeBorderColor:
      - '#7fb4ca' # springBlue - for active borders
      - bold
    inactiveBorderColor:
      - '#737c73' # dragonAsh - for inactive borders
    optionsTextColor:
      - '#7fb4ca' # springBlue - for option text highlights
    selectedLineBgColor:
      - '#282727' # dragonBlack4 - for selected line backgrounds
    cherryPickedCommitBgColor:
      - '#393836' # dragonBlack5 - for cherry-picked commit backgrounds
    cherryPickedCommitFgColor:
      - '#7fb4ca' # springBlue - for cherry-picked commit text
    unstagedChangesColor:
      - '#c4746e' # dragonRed - for unstaged changes
    defaultFgColor:
      - '#c5c9c5' # dragonWhite - for default text
    searchingActiveBorderColor:
      - '#e6c384' # carpYellow - for search highlights
  authorColors:
    '*': '#938aa9' # springViolet1 - for author names
# Diff pagers — cycle between them inside lazygit with `|`
# Note: staging individual lines always uses the builtin diff (pagers are bypassed there)
git:
  diffRenderers:
    - name: delta # default: syntax-highlighted side-by-side diffs
      # no --width: lazygit runs the pager in a pty sized to the diff panel and
      # delta detects that, so side-by-side fills the panel exactly (lazygit's
      # {{columnWidth}} placeholder is half-width, meant for ydiff — don't use it);
      # hunk-header box is replaced with a plain line-number header;
      # clickable lazygit-edit:// links need OSC8 terminal support + a URL handler
      command: delta --dark --syntax-theme=Kanagawa-Dragon --paging=never --line-numbers --side-by-side --hunk-header-decoration-style=omit --hunk-header-style='line-number syntax' --hyperlinks --hyperlinks-file-link-format='lazygit-edit://{path}:{line}'
      colorArg: always
    - name: difftastic # structural, language-aware side-by-side diffs
      command: difft --color=always
      colorArg: always
      type: extDiff
    - type: rawGit
