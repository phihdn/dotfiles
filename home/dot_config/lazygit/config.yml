gui:
  sidePanelWidth: 0.2 # narrow left panel so diffs get more horizontal room
  theme:
    activeBorderColor:
      - '#89b4fa' # blue - for active borders
      - bold
    inactiveBorderColor:
      - '#a6adc8' # subtext0 - for inactive borders
    optionsTextColor:
      - '#89b4fa' # blue - for option text highlights
    selectedLineBgColor:
      - '#313244' # surface0 - for selected line backgrounds
    cherryPickedCommitBgColor:
      - '#45475a' # surface1 - for cherry-picked commit backgrounds
    cherryPickedCommitFgColor:
      - '#89b4fa' # blue - for cherry-picked commit text
    unstagedChangesColor:
      - '#f38ba8' # red - for unstaged changes
    defaultFgColor:
      - '#cdd6f4' # text - for default text
    searchingActiveBorderColor:
      - '#f9e2af' # yellow - for search highlights
  authorColors:
    '*': '#b4befe' # lavender - for author names
# Diff pagers — cycle between them inside lazygit with `|`
# Note: staging individual lines always uses the builtin diff (pagers are bypassed there)
git:
  diffRenderers:
    - name: delta # default: syntax-highlighted side-by-side diffs
      # no --width: lazygit runs the pager in a pty sized to the diff panel and
      # delta detects that, so side-by-side fills the panel exactly (lazygit's
      # {{columnWidth}} placeholder is half-width, meant for ydiff — don't use it);
      # hunk-header box is replaced with a plain line-number header;
      # clickable lazygit-edit:// links need OSC8 terminal support + a URL handler
      command: delta --dark --syntax-theme=Catppuccin-mocha --paging=never --line-numbers --side-by-side --hunk-header-decoration-style=omit --hunk-header-style='line-number syntax' --hyperlinks --hyperlinks-file-link-format='lazygit-edit://{path}:{line}'
      colorArg: always
    - name: difftastic # structural, language-aware side-by-side diffs
      command: difft --color=always
      colorArg: always
      type: extDiff
    - type: rawGit
