#--------------------------------------------------------------------------
# Configuration
#--------------------------------------------------------------------------

# Use Vi mode
# NOTE: commented out to use tmux defaults (emacs keys in copy mode).
# Uncomment to restore vi-style copy mode.
setw -g mode-keys vi

# Increase scrollback buffer size
set -g history-limit 1000000

# setw and set-window-option are the same
# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# Allow automatic renaming of windows
set -g allow-rename on
# set -g automatic-rename on
# set -g automatic-rename-format '#{b:pane_current_path}'

# Renumber windows when one is removed.
set -g renumber-windows on

# Improve colors
set -g default-terminal "${TERM}"
#set-option -g default-terminal "tmux-256color"

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow the mouse to resize windows and select tabs
set -g mouse on

# Allow tmux to set the terminal title
set -g set-titles on

# Monitor window activity to display in the status bar
setw -g monitor-activity on

# A bell in another window should cause a bell in the current window
set -g bell-action any

# Don't show distracting notifications
set -g visual-bell off
set -g visual-activity off

# Focus events enabled for terminals that support them
set -g focus-events on

# Useful when using sharing a session with different size terminals
setw -g aggressive-resize on

# don't detach tmux when killing a session
set -g detach-on-destroy off

# Auto-layout new sessions by path (claude window for repos under ~/ws)
set-hook -g session-created 'run-shell "~/.local/bin/tmux-session-layout #{q:hook_session_name} #{q:session_path}"'

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# use system clipboard
set -g set-clipboard on

set -as terminal-features ",*:RGB"
# set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --> Gruvbox (Dark, Medium) — https://github.com/morhetz/gruvbox
thm_bg="#282828"          # dark0 — default background
thm_fg="#ebdbb2"          # light1 — default foreground
thm_black="#282828"       # dark0 — text on bright accent segments
thm_gray="#3c3836"        # dark1 — neutral segment background
thm_dark="#282828"        # dark0 — text on bright accent segments (alias of thm_black)
thm_red="#fb4934"         # bright red — prefix/urgent accent
thm_green="#b8bb26"       # bright green — session-name accent
thm_yellow="#fabd2f"      # bright yellow
thm_blue="#83a598"        # bright blue — index/directory/date accent
thm_aqua="#8ec07c"        # bright aqua
thm_purple="#d3869b"      # bright purple
thm_orange="#fe8019"      # bright orange

#--------------------------------------------------------------------------
# Status line
#--------------------------------------------------------------------------

# Custom window flags
# window_default_symbol ''   # default value
# window_active_symbol '*'   # window is active
# window_activity_symbol '#' # window has activity
# window_bell_symbol '!'     # window is monitored for activity
# window_last_symbol '-'     # last window
# window_silence_symbol '~'  # window is silent
# window_zoomed_symbol 'Z'   # window has zoomed pane

# update status line every 2 seconds
set -g status-interval 2
set -g status-position top

# Block (powerline-style) chrome: segments get their own highlight color and
# join with  arrows, matching the pre-minimalist look. Bar background stays
# the current flat thm_gray fill (instead of the old transparent/default one).

# Status line customisation
set -g status-left-length 200
set -g status-left "#[fg=${thm_black},bg=#{?client_prefix,$thm_red,$thm_green}]   #[fg=${thm_fg},bg=${thm_gray}] #S "

# status-right
set -g status-right-length 150
## current directory (basename capped at its last 24 chars so a long worktree
## dir cannot push the datetime/uptime segments off the edge)
set -g status-right "#[fg=${thm_dark},bg=${thm_blue}]   #[fg=${thm_fg},bg=${thm_gray}] #{=|-24|…;b:pane_current_path} #(gitmux -cfg $HOME/.config/tmux/gitmux.conf '#{pane_current_path}') "
## calendar 
set -ag status-right "#[fg=${thm_dark},bg=${thm_blue}] 󰃰  #[fg=${thm_fg},bg=${thm_gray}] %Y-%m-%d %H:%M "
## uptime, in the normal segment style until the machine has been up more
## than 7 days, at which point it flips to a red block (see tmux-uptime,
## which owns that threshold and takes an optional override argument)
set -ag status-right "#(tmux-uptime 'fg=${thm_fg},bg=${thm_gray}' 'fg=${thm_dark},bg=${thm_red}')"

## hostname
# if-shell -b 'test $(uname -s) = "Linux"' {
#   set -ag status-right "#[fg=${thm_dark},bg=${thm_blue}]  #[fg=${thm_fg},bg=${thm_gray}] #(hostname) "
# }
# if-shell -b 'test $(uname -s) = "Darwin"' {
#   set -ag status-right "#[fg=${thm_dark},bg=${thm_blue}]   #[fg=${thm_fg},bg=${thm_gray}] #(hostname | cut -f1 -d'.') "
# }

## style
set -g status-right-style "fg=${thm_blue},bg=${thm_gray},nobold,nounderscore,noitalics"

set -g mode-style "fg=${thm_bg},bg=${thm_blue}"
set -g message-style "fg=${thm_blue},bg=${thm_gray}"
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

set -g status-style "fg=${thm_blue},bg=${thm_gray}"
set -g @window-pre "#[fg=${thm_dark},bg=${thm_gray}] "

setw -g window-status-style "NONE,fg=${thm_fg},bg=${thm_gray}"

# Window label is just the running program's name (zsh, nvim, python, ...) —
# the current foreground process in the pane.
window_label="#{pane_current_command}"

setw -g window-status-format         "#{@window-pre}#[fg=${thm_dark},bg=${thm_blue},bold] #I #[fg=${thm_fg},bg=${thm_gray}] #(icons #{pane_current_command}) #[fg=${thm_fg},bg=${thm_gray},nobold,nounderscore,noitalics]${window_label} #{?window_last_flag,-,} "
setw -g window-status-current-format "#{@window-pre}#[fg=${thm_dark},bg=${thm_red},bold] #I #(icons #{pane_current_command})  #[fg=${thm_fg},bg=${thm_gray},nobold,nounderscore,noitalics] ${window_label} #{?window_zoomed_flag, ,} "

set-option -g window-status-activity-style none

#--------------------------------------------------------------------------
# Key Bindings — using tmux DEFAULT keybindings
#--------------------------------------------------------------------------
# All custom keybindings are commented out below (kept for reference).
# tmux now uses its built-in defaults. Uncomment any block to restore it.
#
# To reload this config after editing (no prefix+r binding anymore):
#   from a shell:   tmux source-file ~/.config/tmux/tmux.conf
#   inside tmux:    prefix + :  then type  source-file ~/.config/tmux/tmux.conf
#
# ── DEFAULT KEYBINDINGS CHEAT SHEET (prefix = Ctrl+b) ──────────────────────
# Press the prefix first, release it, then press the key.
#
# Sessions:
#   d           detach from the current session
#   s           list sessions / switch interactively
#   $           rename the current session
#   (  /  )     switch to previous / next session
#
# Windows:
#   c           create a new window
#   ,           rename the current window
#   &           kill the current window (asks for confirmation)
#   n  /  p     go to next / previous window
#   l           go to the last (most recently used) window
#   0-9         jump to window by number
#   w           choose a window from an interactive list
#   .           move current window to another index (prompts)
#   f           find a window by name
#
# Panes:
#   %           split pane left/right (new pane to the right)
#   "           split pane top/bottom (new pane below)
#   Arrow keys  move to the pane in that direction
#   o           cycle to the next pane
#   ;           go to the last (previously active) pane
#   q           show pane numbers (press a number to jump to it)
#   z           toggle pane zoom (fullscreen the pane)
#   x           kill the current pane (asks for confirmation)
#   !           break the pane out into its own window
#   {  /  }     swap pane with the previous / next pane
#   Ctrl+Arrow  resize pane by one cell (hold Ctrl, repeatable)
#   Alt+Arrow   resize pane by five cells (repeatable)
#   Space       cycle through pane layouts
#
# Copy mode (default emacs-style keys):
#   [           enter copy mode (scroll with arrows / PgUp / PgDn)
#   ]           paste the most recent buffer
#   In copy mode: Ctrl+Space begin selection, Ctrl+w copy selection,
#                 q or Escape exit copy mode
#
# Misc:
#   t           show a clock
#   ?           list ALL current key bindings
#   :           open the tmux command prompt
# ───────────────────────────────────────────────────────────────────────────

# ── Previous custom keybindings (commented out — uncomment to restore) ─────
# -r means that the bind can repeat without entering prefix again
# -n means that the bind doesn't use the prefix

# unbind-key C-b
# set -g prefix C-a

# Send prefix to a nested tmux session by doubling the prefix
# bind C-a send-prefix

# 'PREFIX r' to reload of the config file
unbind r
#bind r source-file ~/.tmux.conf\; display-message '~/.tmux.conf reloaded'
bind -N "Reload tmux.conf" r source-file $HOME/.config/tmux/tmux.conf \; display-message 'tmux.conf reloaded'

# Allow holding Ctrl when using using prefix+p/n for switching windows
# bind C-p previous-window
# bind C-n next-window

# Switch between previous and next windows with repeatable
# bind -r n next-window
# bind -r p previous-window

# Shift arrow to switch windows
# bind -n S-Left  previous-window
# bind -n S-Right next-window

# Move around panes like in vim
bind -N "Select pane left (vim-style)" -r h select-pane -L
bind -N "Select pane below (vim-style)" -r j select-pane -D
bind -N "Select pane above (vim-style)" -r k select-pane -U
bind -N "Select pane right (vim-style)" -r l select-pane -R
bind -N "Go to previous window" -r C-h select-window -t :-
bind -N "Go to next window" -r C-l select-window -t :+

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# keybindings: prefix + [ to activate copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Smart pane switching with awareness of vim splits
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# resize panes more easily with Ctrl
# bind C-H resize-pane -L 5
# bind C-L resize-pane -R 5
# bind C-J resize-pane -D 5
# bind C-K resize-pane -U 5

# resize panes more easily
# bind -r H resize-pane -L 5
# bind -r L resize-pane -R 5
# bind -r J resize-pane -D 5
# bind -r K resize-pane -U 5

# Move the current window left/right, swapping it with its neighbor
# (default prefix+. moves to a specific index and fails if that index is taken)
bind -N "Move window right (swap with next)" -r N swap-window -t +1 \; select-window -t +1
bind -N "Move window left (swap with previous)" -r P swap-window -t -1 \; select-window -t -1

# Switch between two most recently used windows
# (default is prefix+l, but that's taken by vim-style pane nav above;
# Space's default next-layout is rarely used)
bind -N "Toggle last window" Space last-window

# switch between two most recently used sessions
