#--------------------------------------------------------------------------
# Configuration
#--------------------------------------------------------------------------

# Use Vi mode
# NOTE: commented out to use tmux defaults (emacs keys in copy mode).
# Uncomment to restore vi-style copy mode.
setw -g mode-keys vi

# Increase scrollback buffer size. Capped at 100k — at 1M lines/pane the
# server's memory footprint alone contributes to the load spikes the status
# bar is built to survive (tmux/tmux#3352 pairs big history with slow redraws).
set -g history-limit 100000

# setw and set-window-option are the same
# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# Allow automatic renaming of windows
set -g allow-rename on
# set -g automatic-rename on
# set -g automatic-rename-format '#{b:pane_current_path}'

# Renumber windows when one is removed.
set -g renumber-windows on

# Improve colors
set -g default-terminal "${TERM}"
#set-option -g default-terminal "tmux-256color"

# Every terminal-overrides/terminal-features line below appends, so sourcing
# this file again appends the same entries a second time — after a session's
# worth of reloads the lists had grown to 121 and 43 entries. Reset both here so
# each reload rebuilds them, restating the defaults a reset would otherwise
# drop (`tmux -f /dev/null show -s` prints exactly these).
set -s terminal-overrides 'linux*:AX@'
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys'

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow the mouse to resize windows and select tabs
set -g mouse on

# Allow tmux to set the terminal title
set -g set-titles on

# Monitor window activity to display in the status bar
setw -g monitor-activity on

# A bell in another window should cause a bell in the current window
set -g bell-action any

# Don't show distracting notifications
set -g visual-bell off
set -g visual-activity off

# Focus events enabled for terminals that support them
set -g focus-events on

# Useful when using sharing a session with different size terminals
setw -g aggressive-resize on

# don't detach tmux when killing a session
set -g detach-on-destroy off

# Auto-layout new sessions by path (claude window for repos under ~/ws)
set-hook -g session-created 'run-shell "~/.local/bin/tmux-session-layout #{q:hook_session_name} #{q:session_path}"'

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# use system clipboard
set -g set-clipboard on

set -as terminal-features ",*:RGB"
# set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# --> Catppuccin Mocha — https://github.com/catppuccin/catppuccin
thm_bg="#1e1e2e"          # base — default background
thm_fg="#cdd6f4"          # text — default foreground
thm_black="#1e1e2e"       # base — text on bright accent segments
thm_gray="#313244"        # surface0 — neutral segment background
thm_dark="#1e1e2e"        # base — text on bright accent segments (alias of thm_black)
thm_red="#f38ba8"         # red — prefix/urgent accent
thm_green="#a6e3a1"       # green — session-name accent
thm_yellow="#f9e2af"      # yellow
thm_blue="#89b4fa"        # blue — index/directory/date accent
thm_aqua="#94e2d5"        # teal
thm_purple="#cba6f7"      # mauve
thm_orange="#fab387"      # peach
thm_dim="#6c7086"         # overlay0 — inactive tabs, two steps below the active ones

#--------------------------------------------------------------------------
# Status line
#--------------------------------------------------------------------------

# Custom window flags
# window_default_symbol ''   # default value
# window_active_symbol '*'   # window is active
# window_activity_symbol '#' # window has activity
# window_bell_symbol '!'     # window is monitored for activity
# window_last_symbol '-'     # last window
# window_silence_symbol '~'  # window is silent
# window_zoomed_symbol 'Z'   # window has zoomed pane

# The bar contains no #() subshells: tmux-status-daemon (started below) pushes
# every dynamic segment into @-options, so a refresh is a pure string render.
# Machine load can only delay the numbers, never stall the bar — with #() in
# the format, redraws also degraded with scrollback size (tmux/tmux#3352).
# 15s bounds redraw work and is the daemon's own tick rate; the clock shows
# minutes and uptime is in days, so nothing needs finer.
set -g status-interval 15
set -g status-position top

# Tokyo Night layout (janoamaral/tokyo-night-tmux) in the Mocha palette: the
# session name sits in a solid blue block, tabs read "glyph number name" with
# the active one on a surface0 block and the last-used one flagged 󰁯, and the
# right side is a row of widgets led by ░/▒ block glyphs, ending in the clock
# on a surface0 block. Color roles — tokyo background→base, foreground→text,
# bblack→surface0, blue→blue, green→teal, yellow→yellow, red→red, magenta→mauve.
# Styles are written one property per #[...] so pieces can sit inside #{?…}
# conditionals without their commas being read as branch separators.
reset="#[fg=${thm_fg}]#[bg=${thm_bg}]#[nobold]#[noitalics]#[nounderscore]#[nodim]"

## stylised window index, mapped natively (no fork). The theme's default
## "digital" digits live in a Unicode block Nerd Font patches do not cover, so
## this uses its Nerd Font filled-square style instead; past 9 the plain number
## shows. The theme's pane index after the name is left out — a second number
## per tab reads as another window index.
win_num="#{?#{==:#I,1},󰎤,#{?#{==:#I,2},󰎧,#{?#{==:#I,3},󰎪,#{?#{==:#I,4},󰎭,#{?#{==:#I,5},󰎱,#{?#{==:#I,6},󰎳,#{?#{==:#I,7},󰎶,#{?#{==:#I,8},󰎹,#{?#{==:#I,9},󰎼,#I}}}}}}}}}"

# Status line customisation
set -g status-left-length 80
## session block: dark bold text on blue; the icon is dimmed and flips to 󰠠 on
## a red block while the prefix is held.
set -g status-left "#[fg=${thm_dark}]#[bg=#{?client_prefix,${thm_red},${thm_blue}}]#[bold] #{?client_prefix,󰠠 ,#[dim]󰤂 }#[bold]#[nodim]#S ${reset}"

# status-right
set -g status-right-length 150
## path widget (basename capped at its last 24 chars so a long worktree dir
## cannot push the rest of the bar off the edge)
set -g status-right "#[fg=${thm_blue}]░  #[fg=${thm_fg}]#{=|-24|…;b:pane_current_path} "
## git widget — tmux-status-daemon wraps gitmux output in the theme's ▒ block,
## colored by repo state (@status_git_styles: synced|dirty|ahead|behind);
## session-scoped, hidden outside a repo
set -ag status-right "#{?#{@status_git},#{@status_git} ,}"
## claude widget — count of live Claude Code sessions (tmux-claude-status);
## the whole widget turns a red block while any session waits on you, as does
## that window's tab. Hidden with no session.
cs_bg="#{?#{==:#{@status_claude_state},attention},${thm_red},${thm_bg}}"
cs_ic="#{?#{==:#{@status_claude_state},attention},${thm_dark},${thm_purple}}"
cs_fg="#{?#{==:#{@status_claude_state},attention},${thm_dark},${thm_fg}}"
set -ag status-right "#{?#{@status_claude},#[bg=${cs_bg}]#[fg=${cs_ic}]░  #[fg=${cs_fg}]#{@status_claude} ${reset},}"
## cpu and memory, both as a percentage of total capacity, from one
## tmux-sysinfo run per daemon tick; the memory value flips to the alert style
## past TMUX_SYSINFO_MEM_ALERT (85% by default) — the point where the machine
## is about to start swapping
set -ag status-right "#[fg=${thm_orange}]░ #{@status_sysinfo}"
## uptime, flipping to a red block past 7 days (see tmux-uptime, which owns the
## threshold and takes an optional override argument)
set -ag status-right "#[fg=${thm_aqua}]░#{@status_uptime}"
## clock block, date ❬ time as in the theme's YMD/24H default
set -ag status-right "#[fg=${thm_fg}]#[bg=${thm_gray}] %Y-%m-%d ❬ %H:%M "

## style
set -g status-right-style "fg=${thm_fg},bg=${thm_bg},nobold,nounderscore,noitalics"

set -g mode-style "fg=${thm_bg},bg=${thm_blue}"
set -g message-style "fg=${thm_dark},bg=${thm_blue}"
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

set -g status-style "fg=${thm_fg},bg=${thm_bg}"
setw -g window-status-style "NONE,fg=${thm_fg},bg=${thm_bg}"
setw -g window-status-separator ""

## tabs: "glyph number name" (plus 󰊓 when zoomed), the active one bold on a surface0
## block, inactive ones dimmed on the bar with the last-used window flagged 󰁯
## in yellow. The program glyph (@win_icon, from tmux-status-daemon) takes the
## theme's teal terminal-icon role on the active tab and the dim role on the
## others. The window's Claude state (@win_claude, written by
## tmux-claude-status) overrides that: glyph, index and name turn blue while
## Claude works, and the whole tab becomes a red block while it waits on you.
att="#{==:#{@win_claude},attention}"
wrk="#{==:#{@win_claude},working}"
tab_bg_cur="#{?${att},${thm_red},${thm_gray}}"
tab_bg_dim="#{?${att},${thm_red},${thm_bg}}"
ic_fg_cur="#{?${att},${thm_dark},#{?${wrk},${thm_blue},${thm_aqua}}}"
ic_fg_dim="#{?${att},${thm_dark},#{?${wrk},${thm_blue},${thm_dim}}}"
tab_fg_cur="#{?${att},${thm_dark},#{?${wrk},${thm_blue},${thm_fg}}}"
tab_fg_dim="#{?${att},${thm_dark},#{?${wrk},${thm_blue},${thm_dim}}}"
last_fg="#{?${att},${thm_dark},${thm_yellow}}"
setw -g window-status-current-format "${reset}#[bg=${tab_bg_cur}] #[fg=${ic_fg_cur}]#{@win_icon} #[fg=${tab_fg_cur}]#[bold]${win_num} #W#[nobold]#{?window_zoomed_flag, 󰊓,} ${reset}"
setw -g window-status-format         "${reset}#[bg=${tab_bg_dim}] #[fg=${ic_fg_dim}]#{@win_icon} #[fg=${tab_fg_dim}]${win_num} #W #{?window_zoomed_flag,󰊓 ,}#[fg=${last_fg}]#{?window_last_flag,󰁯 ,}${reset}"

set-option -g window-status-activity-style none

# Background updater: every dynamic segment above reads a stored @-option,
# pushed by tmux-status-daemon. Singleton — a config reload re-runs this and
# the newcomer exits if a live daemon already owns @status_daemon_pid.
set -g @status_git_styles "fg=${thm_green}|fg=${thm_orange}|fg=${thm_red}|fg=${thm_purple}"
run-shell -b "tmux-status-daemon start 'fg=${thm_orange}' 'fg=${thm_fg}' 'fg=${thm_dark},bg=${thm_red}' 'fg=${thm_fg}' 'fg=${thm_dark},bg=${thm_red}'"

# The git and Claude segments follow focus through hooks instead of waiting
# out the tick: switching windows or sessions lands on a different repo often
# enough that a 15s-stale gitmux line reads as wrong, and looking at a window
# is what acknowledges its finished Claude turn. Pane switches within a window
# stay on the tick — same-window panes almost always share a repo.
# session-created must append (-a): the layout hook above owns the plain set.
set-hook -g  after-select-window    'run-shell -b "tmux-status-daemon refresh-focus #{q:session_id} #{q:pane_current_path}"'
set-hook -g  client-session-changed 'run-shell -b "tmux-status-daemon refresh-focus #{q:session_id} #{q:pane_current_path}"'
set-hook -ag session-created        'run-shell -b "tmux-status-daemon refresh-focus #{q:session_id} #{q:pane_current_path}"'

#--------------------------------------------------------------------------
# Key Bindings — using tmux DEFAULT keybindings
#--------------------------------------------------------------------------
# All custom keybindings are commented out below (kept for reference).
# tmux now uses its built-in defaults. Uncomment any block to restore it.
#
# To reload this config after editing (no prefix+r binding anymore):
#   from a shell:   tmux source-file ~/.config/tmux/tmux.conf
#   inside tmux:    prefix + :  then type  source-file ~/.config/tmux/tmux.conf
#
# ── DEFAULT KEYBINDINGS CHEAT SHEET (prefix = Ctrl+b) ──────────────────────
# Press the prefix first, release it, then press the key.
#
# Sessions:
#   d           detach from the current session
#   s           list sessions / switch interactively
#   $           rename the current session
#   (  /  )     switch to previous / next session
#
# Windows:
#   c           create a new window
#   ,           rename the current window
#   &           kill the current window (asks for confirmation)
#   n  /  p     go to next / previous window
#   l           go to the last (most recently used) window
#   0-9         jump to window by number
#   w           choose a window from an interactive list
#   .           move current window to another index (prompts)
#   f           find a window by name
#
# Panes:
#   %           split pane left/right (new pane to the right)
#   "           split pane top/bottom (new pane below)
#   Arrow keys  move to the pane in that direction
#   o           cycle to the next pane
#   ;           go to the last (previously active) pane
#   q           show pane numbers (press a number to jump to it)
#   z           toggle pane zoom (fullscreen the pane)
#   x           kill the current pane (asks for confirmation)
#   !           break the pane out into its own window
#   {  /  }     swap pane with the previous / next pane
#   Ctrl+Arrow  resize pane by one cell (hold Ctrl, repeatable)
#   Alt+Arrow   resize pane by five cells (repeatable)
#   Space       cycle through pane layouts
#
# Copy mode (default emacs-style keys):
#   [           enter copy mode (scroll with arrows / PgUp / PgDn)
#   ]           paste the most recent buffer
#   In copy mode: Ctrl+Space begin selection, Ctrl+w copy selection,
#                 q or Escape exit copy mode
#
# Misc:
#   t           show a clock
#   ?           list ALL current key bindings
#   :           open the tmux command prompt
# ───────────────────────────────────────────────────────────────────────────

# ── Previous custom keybindings (commented out — uncomment to restore) ─────
# -r means that the bind can repeat without entering prefix again
# -n means that the bind doesn't use the prefix

# unbind-key C-b
# set -g prefix C-a

# Send prefix to a nested tmux session by doubling the prefix
# bind C-a send-prefix

# 'PREFIX r' to reload of the config file
unbind r
#bind r source-file ~/.tmux.conf\; display-message '~/.tmux.conf reloaded'
bind -N "Reload tmux.conf" r source-file $HOME/.config/tmux/tmux.conf \; display-message 'tmux.conf reloaded'

# Allow holding Ctrl when using using prefix+p/n for switching windows
# bind C-p previous-window
# bind C-n next-window

# Switch between previous and next windows with repeatable
