# open lazygit in a popup with prefix+g — used in short bursts, so a popup
# beats a standing window (no window sprawl; -E closes it when lazygit exits).
# lg wraps lazygit to handle bare-repo worktree roots.
bind-key g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lg"

# show a promp to kill a window by id with prefix+X
# (default: prefix+& kills the window, prefix+x kills the pane — both ask to confirm)
# bind-key X command-prompt -p "kill window: " "kill-window -t '%%'"
# bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

# use prefix+| (or prefix+\) to split window horizontally and prefix+- or
